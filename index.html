<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audio Drop // Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00ffcc;
      --accent-dim: rgba(0, 255, 204, 0.15);
      --accent2: #ff0055;
      --text: #f0f3f6;
      --muted: #7e8b9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(0, 255, 204, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Visualizer Card */
    .vis-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
      border-radius: 10px;
      overflow: hidden;
      background: #040507;
      border: 1px solid rgba(255,255,255,0.05);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .vis-modes {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .vis-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vis-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Player Controls */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .now-playing-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .track-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .track-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      border-radius: 3px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .control-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 4px;
    }

    .btn-circle {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn-play {
      width: 58px;
      height: 58px;
      background: var(--accent);
      color: #000;
      font-size: 20px;
      border: none;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }

    .btn-circle:active {
      transform: scale(0.94);
    }

    /* Playlist Drag & Drop */
    .playlist-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 6px;
    }

    .track-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-item.active {
      background: var(--accent-dim);
      border-color: rgba(0, 255, 204, 0.3);
    }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 0 4px;
    }

    .track-idx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      width: 18px;
    }

    .track-details {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .track-name {
      font-size: 14px;
      font-weight: 600;
    }

    .track-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .track-item.dragging {
      opacity: 0.4;
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="title">AUDIO DROP</div>
      <div class="badge">Instagram Bio Player</div>
    </header>

    <!-- Visualizer Canvas -->
    <div class="vis-card">
      <div class="canvas-wrapper">
        <canvas id="visualizerCanvas"></canvas>
      </div>
      <div class="vis-modes">
        <button class="vis-btn active" data-mode="bars">BARS</button>
        <button class="vis-btn" data-mode="wave">WAVE</button>
        <button class="vis-btn" data-mode="bloom">BLOOM</button>
      </div>
    </div>

    <!-- Active Player -->
    <div class="player-card">
      <div class="now-playing-info">
        <div>
          <div class="track-title" id="currentTrackTitle">Track 01</div>
          <div class="track-meta" id="currentTrackMeta">Ready to stream</div>
        </div>
        <div class="track-meta" id="statusBadge">PAUSED</div>
      </div>

      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="time-info">
        <span id="currentTime">00:00</span>
        <span id="durationTime">00:00</span>
      </div>

      <div class="control-buttons">
        <button class="btn-circle" id="prevBtn">⏮</button>
        <button class="btn-circle btn-play" id="playBtn">▶</button>
        <button class="btn-circle" id="nextBtn">⏭</button>
      </div>
    </div>

    <!-- Playlist with Drag and Drop -->
    <div class="playlist-card">
      <div class="playlist-header">Playlist (Drag to reorder)</div>
      <ul class="track-list" id="trackList"></ul>
    </div>
  </div>

  <script>
    // Массив с точными именами загруженных файлов
    let playlist = [
      { id: 1, title: "Track 01", sub: "Cut 1", url: encodeURI("track1 (1).mp3") },
      { id: 2, title: "Track 02", sub: "Cut 2", url: encodeURI("track1 (2).mp3") },
      { id: 3, title: "Track 03", sub: "Cut 3", url: encodeURI("track1 (3).mp3") },
      { id: 4, title: "Track 04", sub: "Cut 4", url: encodeURI("track1 (4).mp3") },
      { id: 5, title: "Track 07", sub: "Cut 7", url: encodeURI("track1 (7).mp3") }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let visMode = 'bars';

    // Аудио элементы и Web Audio API
    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let dataArray = null;

    // DOM Элементы
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackListEl = document.getElementById('trackList');
    const currentTrackTitle = document.getElementById('currentTrackTitle');
    const currentTrackMeta = document.getElementById('currentTrackMeta');
    const statusBadge = document.getElementById('statusBadge');
    const progressBar = document.getElementById('progressBar');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const visBtns = document.querySelectorAll('.vis-btn');

    // Настройка размеров Canvas
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Инициализация Web Audio API
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
    }

    // Рендер плейлиста
    function renderPlaylist() {
      trackListEl.innerHTML = '';
      playlist.forEach((track, idx) => {
        const li = document.createElement('li');
        li.className = `track-item ${idx === currentIndex ? 'active' : ''}`;
        li.draggable = true;
        li.dataset.index = idx;

        li.innerHTML = `
          <span class="drag-handle">:::</span>
          <span class="track-idx">${idx + 1 < 10 ? '0' + (idx + 1) : idx + 1}</span>
          <div class="track-details">
            <span class="track-name">${track.title}</span>
            <span class="track-sub">${track.sub}</span>
          </div>
        `;

        li.addEventListener('click', (e) => {
          if (e.target.classList.contains('drag-handle')) return;
          loadAndPlayTrack(idx);
        });

        // Drag & Drop
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('drop', handleDrop);
        li.addEventListener('dragend', handleDragEnd);

        trackListEl.appendChild(li);
      });
    }

    // Загрузка и запуск трека
    function loadAndPlayTrack(idx) {
      initAudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      currentIndex = idx;
      const track = playlist[currentIndex];
      audio.src = track.url;
      currentTrackTitle.textContent = track.title;
      currentTrackMeta.textContent = track.sub;
      statusBadge.textContent = "PLAYING";
      
      renderPlaylist();

      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = '⏸';
      }).catch(err => {
        console.warn("Autoplay block or missing file:", err);
      });
    }

    // Play/Pause
    playBtn.addEventListener('click', () => {
      initAudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶';
        statusBadge.textContent = "PAUSED";
      } else {
        if (!audio.src) {
          loadAndPlayTrack(currentIndex);
        } else {
          audio.play();
          isPlaying = true;
          playBtn.textContent = '⏸';
          statusBadge.textContent = "PLAYING";
        }
      }
    });

    prevBtn.addEventListener('click', () => {
      let idx = currentIndex - 1;
      if (idx < 0) idx = playlist.length - 1;
      loadAndPlayTrack(idx);
    });

    nextBtn.addEventListener('click', () => {
      let idx = currentIndex + 1;
      if (idx >= playlist.length) idx = 0;
      loadAndPlayTrack(idx);
    });

    audio.addEventListener('ended', () => {
      let idx = currentIndex + 1;
      if (idx < playlist.length) {
        loadAndPlayTrack(idx);
      } else {
        isPlaying = false;
        playBtn.textContent = '▶';
        statusBadge.textContent = "END";
      }
    });

    // Прогресс бар и время
    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }

    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime;
      const duration = audio.duration || 0;
      currentTimeEl.textContent = formatTime(current);
      durationTimeEl.textContent = formatTime(duration);
      if (duration > 0) {
        progressBar.style.width = `${(current / duration) * 100}%`;
      }
    });

    progressBarContainer.addEventListener('click', (e) => {
      const rect = progressBarContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pos * audio.duration;
      }
    });

    // Режимы визуализатора
    visBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        visBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        visMode = btn.dataset.mode;
      });
    });

    // Анимация Canvas
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = '#040507';
      ctx.fillRect(0, 0, w, h);

      if (!analyser) return;

      if (visMode === 'wave') {
        analyser.getByteTimeDomainData(dataArray);
        ctx.lineWidth = 2 * window.devicePixelRatio;
        ctx.strokeStyle = '#00ffcc';
        ctx.beginPath();

        const sliceWidth = w / dataArray.length;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * h) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(w, h / 2);
        ctx.stroke();

      } else if (visMode === 'bloom') {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 16; i++) sum += dataArray[i];
        const bassVal = sum / 16;
        const radius = (h * 0.2) + (bassVal / 255) * (h * 0.25);

        const gradient = ctx.createRadialGradient(w/2, h/2, radius * 0.2, w/2, h/2, radius);
        gradient.addColorStop(0, '#00ffcc');
        gradient.addColorStop(0.7, '#ff0055');
        gradient.addColorStop(1, 'transparent');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(w/2, h/2, radius, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // 'bars'
        analyser.getByteFrequencyData(dataArray);
        const bars = 36;
        const barWidth = (w / bars) - (3 * window.devicePixelRatio);
        for (let i = 0; i < bars; i++) {
          const val = dataArray[i];
          const barHeight = (val / 255) * (h * 0.85);
          const x = i * (barWidth + (3 * window.devicePixelRatio));
          const y = h - barHeight;

          const grad = ctx.createLinearGradient(0, y, 0, h);
          grad.addColorStop(0, '#00ffcc');
          grad.addColorStop(1, 'rgba(255, 0, 85, 0.4)');

          ctx.fillStyle = grad;
          ctx.fillRect(x, y, barWidth, barHeight);
        }
      }
    }
    drawVisualizer();

    // Обработчики Drag & Drop
    let dragSrcIndex = null;

    function handleDragStart(e) {
      dragSrcIndex = Number(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    function handleDrop(e) {
      e.stopPropagation();
      const dropIndex = Number(this.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== dropIndex) {
        const movedItem = playlist.splice(dragSrcIndex, 1)[0];
        playlist.splice(dropIndex, 0, movedItem);
        renderPlaylist();
      }
      return false;
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    // Первый запуск
    renderPlaylist();
  </script>
</body>
</html>
